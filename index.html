<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lusciana - Accueil</title>
    <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 48px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 12px; font-size: 28px; }
        .sub { color: #666; margin-bottom: 32px; font-size: 15px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-team { background: #667eea; color: #fff; }
        .btn-team:hover { background: #5a67d8; }
        .btn-admin { background: #f0f0f0; color: #333; border: 2px solid #ddd; }
        .btn-admin:hover { background: #e8e8e8; border-color: #667eea; color: #667eea; }
        .login-panel { display: none; text-align: left; }
        .login-panel.visible { display: block; }
        .back { margin-bottom: 20px; }
        .back a { color: #667eea; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 14px; }
        .back a:hover { text-decoration: underline; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn-google { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: #fff; color: #333; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
        .btn-google:hover { background: #f8f8f8; border-color: #667eea; color: #667eea; }
        .divider { margin: 20px 0; color: #999; font-size: 14px; }
        .btn-submit { width: 100%; padding: 14px; background: #667eea; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background: #5a67d8; }
        .error { color: #dc2626; font-size: 14px; margin-top: 12px; }
        .choice-panel { display: block; }
        .choice-panel.hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div id="choicePanel" class="choice-panel">
            <h1>🏗️ Lusciana</h1>
            <p class="sub">Choisis comment accéder au site.</p>
            <button type="button" class="btn btn-team" onclick="showTeamLogin()">Accéder au site de la team</button>
            <button type="button" class="btn btn-admin" onclick="showAdminLogin()">Espace admin</button>
        </div>

        <div id="teamLoginPanel" class="login-panel">
            <p class="back"><a onclick="showChoice()">← Retour</a></p>
            <h2 style="margin-bottom: 16px; font-size: 20px;">Connexion – Site de la team</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 16px;">Connecte-toi avec Google ou email. Ton adresse doit être autorisée par l’admin.</p>
            <button type="button" class="btn-google" onclick="loginTeamGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="20" height="20" onerror="this.style.display='none'">
                Se connecter avec Google
            </button>
            <p class="divider">— ou —</p>
            <form onsubmit="loginTeamEmail(); return false;">
                <div class="form-group">
                    <label for="teamEmail">Email</label>
                    <input type="email" id="teamEmail" placeholder="toi@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="teamPassword">Mot de passe</label>
                    <input type="password" id="teamPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Se connecter avec email</button>
            </form>
            <p id="teamError" class="error" style="display: none;"></p>
        </div>

        <div id="adminLoginPanel" class="login-panel">
            <p class="back"><a onclick="showChoice()">← Retour</a></p>
            <h2 style="margin-bottom: 16px; font-size: 20px;">Espace admin</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 16px;">Connexion Google uniquement (luscianabuilds@gmail.com).</p>
            <button type="button" class="btn-google" onclick="loginAdminGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="20" height="20" onerror="this.style.display='none'">
                Se connecter avec Google
            </button>
            <p id="adminError" class="error" style="display: none;"></p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAGNnVNpRPRYc7ggMTG4dESxwdn3A-luaI",
            authDomain: "luscianamanager.firebaseapp.com",
            databaseURL: "https://luscianamanager-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "luscianamanager",
            storageBucket: "luscianamanager.firebasestorage.app",
            messagingSenderId: "375459557861",
            appId: "1:375459557861:web:4d6234200624416816ff0c",
            measurementId: "G-LQ5HYX18L8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const ADMIN_EMAIL = 'luscianabuilds@gmail.com';

        function showChoice() {
            document.getElementById('choicePanel').classList.remove('hidden');
            document.getElementById('teamLoginPanel').classList.remove('visible');
            document.getElementById('adminLoginPanel').classList.remove('visible');
            document.getElementById('teamError').style.display = 'none';
            document.getElementById('adminError').style.display = 'none';
        }

        function showTeamLogin() {
            document.getElementById('choicePanel').classList.add('hidden');
            document.getElementById('teamLoginPanel').classList.add('visible');
            document.getElementById('adminLoginPanel').classList.remove('visible');
        }

        function showAdminLogin() {
            document.getElementById('choicePanel').classList.add('hidden');
            document.getElementById('adminLoginPanel').classList.add('visible');
            document.getElementById('teamLoginPanel').classList.remove('visible');
        }

        function setTeamError(msg) {
            var el = document.getElementById('teamError');
            el.textContent = msg || '';
            el.style.display = msg ? 'block' : 'none';
        }

        function setAdminError(msg) {
            var el = document.getElementById('adminError');
            el.textContent = msg || '';
            el.style.display = msg ? 'block' : 'none';
        }

        function emailToKey(email) {
            return (email || '').trim().toLowerCase().replace(/\./g, '_');
        }

        function checkAllowedAndGoTeam(user) {
            var email = (user && user.email) ? user.email.trim().toLowerCase() : '';
            if (!email) {
                setTeamError('Email non disponible.');
                return;
            }
            db.ref('allowedEmails').once('value').then(function (snap) {
                var list = snap.val() || {};
                if (list[emailToKey(email)]) {
                    window.location.href = 'team.html';
                } else {
                    auth.signOut();
                    setTeamError('Accès refusé. Ton adresse n\'est pas autorisée. Demande à l\'admin de t\'ajouter.');
                }
            }).catch(function (err) {
                setTeamError('Erreur de vérification. Réessaie.');
            });
        }

        function loginTeamGoogle() {
            setTeamError('');
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function (result) {
                checkAllowedAndGoTeam(result.user);
            }).catch(function (err) {
                setTeamError(err.message || 'Erreur de connexion.');
            });
        }

        function loginTeamEmail() {
            var email = document.getElementById('teamEmail').value.trim();
            var password = document.getElementById('teamPassword').value;
            setTeamError('');
            if (!email || !password) {
                setTeamError('Saisis email et mot de passe.');
                return;
            }
            auth.signInWithEmailAndPassword(email, password).then(function (result) {
                checkAllowedAndGoTeam(result.user);
            }).catch(function (err) {
                var msg = err.message || 'Erreur de connexion.';
                if (err.code === 'auth/invalid-credential') msg = 'Email ou mot de passe incorrect.';
                setTeamError(msg);
            });
        }

        function loginAdminGoogle() {
            setAdminError('');
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(function (result) {
                var email = (result.user && result.user.email) ? result.user.email.trim().toLowerCase() : '';
                if (email === ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = 'admin.html';
                } else {
                    auth.signOut();
                    setAdminError('Accès réservé à l\'administrateur (luscianabuilds@gmail.com).');
                }
            }).catch(function (err) {
                setAdminError(err.message || 'Erreur de connexion.');
            });
        }

        auth.onAuthStateChanged(function (user) {
            if (user && document.getElementById('adminLoginPanel').classList.contains('visible')) {
                var email = (user.email || '').trim().toLowerCase();
                if (email === ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = 'admin.html';
                }
            }
        });
    </script>
</body>
</html>
