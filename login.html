<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Commission Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 360px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 24px; font-size: 22px; text-align: center; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; color: #555; font-weight: 500; }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
        }
        .field input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #5a67d8; }
        .btn-google {
            background: #fff;
            color: #333;
            border: 2px solid #ddd;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google:hover { background: #f8f8f8; border-color: #667eea; color: #667eea; }
        .divider { margin: 20px 0; color: #999; font-size: 14px; text-align: center; }
        .error { color: #dc2626; font-size: 14px; margin-top: 12px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Connexion</h1>
        <p style="color: #666; margin-bottom: 20px; font-size: 14px; text-align: center;">Connecte-toi pour accéder au Commission Manager.</p>
        <button type="button" class="btn-google" id="btnGoogle" onclick="loginGoogle();">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="20" height="20" onerror="this.style.display='none'">
            Se connecter avec Google
        </button>
        <p class="divider">— ou —</p>
        <form onsubmit="return loginEmail();">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="toi@exemple.com">
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Se connecter avec email</button>
        </form>
        <p id="error" class="error">Accès refusé</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-database-compat.js"></script>
    <script src="firebase.js"></script>
    <script>
        var errEl = document.getElementById('error');

        function showError(msg) {
            errEl.textContent = msg || 'Accès refusé';
            errEl.style.display = 'block';
        }

        function loginGoogle() {
            errEl.style.display = 'none';
            auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
        }

        function loginEmail() {
            errEl.style.display = 'none';
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            if (!email || !password) return false;
            auth.signInWithEmailAndPassword(email, password).then(function () {
                window.location.href = 'index.html';
            }).catch(function (err) {
                var msg = err.message || 'Erreur de connexion.';
                if (err.code === 'auth/invalid-credential') msg = 'Email ou mot de passe incorrect.';
                if (err.code === 'auth/user-not-found') msg = 'Aucun compte avec cet email.';
                showError(msg);
            });
            return false;
        }

        auth.getRedirectResult().then(function (result) {
            if (result.user) window.location.href = 'index.html';
        }).catch(function (err) {
            showError(err.message || 'Erreur de connexion.');
        });

        auth.onAuthStateChanged(function (user) {
            if (user) window.location.href = 'index.html';
        });
    </script>
</body>
</html>
